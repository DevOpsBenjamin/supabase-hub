project_id = "supabase-hub"

[api]
enabled = true
port = 54321
# One entry per app schema. PostgREST refuses any schema absent from this list,
# and the remote project needs the same list under
# Project Settings > API > Exposed schemas.
schemas = ["public", "graphql_public", "app_simple_body_graph", "app_handibaby"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Keep aligned with the linked project's Postgres version.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seeds/*.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://simplebodygraph.pages.dev"
additional_redirect_urls = [
  "https://*.pages.dev/**",
  "http://localhost:*/**",
  "http://127.0.0.1:*/**",
  "https://*.vercel.app/**"
]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

